# The `plots` section customizes every image that is output to hard-disk during a model-fit.

# For example, if `plots: fit: subplot_fit=True``, the ``subplot_fit.png`` subplot file will
# be plotted every time visualization is performed.

# One setting is important for inspecting results via the dataset after a fit is complete:

# -`fits_adapt_images`, This outputs `adapt_images.fits` which the database functionality may use to reperform fits.

# It can be disabled to save on hard-disk space but will lead to certain database functionality being disabled.

# The dataset itself is always output as `dataset.fits` to the `image` folder of every fit, and is not controlled
# by any setting here.

subplot_format: [png]                      # Output format of all subplots, can be png, pdf or both (e.g. [png, pdf])
fits_are_zoomed: false                     # If true, output .fits files are zoomed in on the center of the unmasked region image, saving hard-disk space.

dataset:                                   # Settings for plots of all datasets (e.g. Imaging, Interferometer).
  subplot_dataset: true                    # Plot subplot containing all dataset quantities (e.g. the data, noise-map, etc.)?

positions:                                 # Settings for plots with resampling image-positions on (e.g. the image).
  image_with_positions: true # If True, output the image with the positions overlaid.

fit:                                       # Settings for plots of all fits (e.g. FitImaging, FitInterferometer).
  subplot_fit: true                        # Plot subplot of all fit quantities for any dataset (e.g. the model data, residual-map, etc.)?
  subplot_fit_log10: false                  # Plot subplot of all fit quantities for any dataset using log10 color maps (e.g. the model data, residual-map, etc.)?
  subplot_of_planes: false                 # Plot subplot of the model-image, subtracted image and other quantities of each plane?
  subplot_galaxies_images: false              # Plot subplot of the image of each plane in the model?
  fits_fit: true                           # Output a .fits file containing the fit model data, residual map, normalized residual map and chi-squared?
  fits_galaxy_images : true                # Output a .fits file containing the images (e.g. without PSF convolution) of every galaxy?
  fits_model_galaxy_images : true          # Output a .fits file containing the model images (e.g. with PSF convolution) of every galaxy?

fit_imaging: {}                            # Settings for plots of fits to imaging datasets (e.g. FitImaging).

tracer:                                    # Settings for plots of tracers (e.g. Tracer).
  subplot_tracer: true                     # Plot subplot of all quantities in each tracer (e.g. images, convergence)?
  subplot_galaxies_images: false           # Plot subplot of the image of each plane in the tracer?
  fits_tracer: true                        # Output tracer.fits file of tracer's convergence, potential, deflections_y and deflections_x?
  fits_source_plane_images: true           # Output source_plane_images.fits file of the source-plane image (light profiles only) of each galaxy in the tracer?
  fits_source_plane_shape: (100, 100)      # The shape of the source-plane image output in the fits_source_plane_images.fits file.

inversion:                                 # Settings for plots of inversions (e.g. InversionPlotter).
  subplot_inversion: true                  # Plot subplot of all quantities in each inversion (e.g. reconstrucuted image, reconstruction)?
  subplot_mappings: false                  # Plot subplot of how the brightest source regions map to their multiple images in the image-plane (works for pixelized and parametric sources)?
  csv_reconstruction: true               # output source_plane_reconstruction_0.csv containing the source-plane mesh y, x, reconstruction and noise map values.

adapt:                                     # Settings for plots of adapt images used by adaptive pixelizations.
  subplot_adapt_images: true               # Plot subplot showing each adapt image used for adaptive pixelization?
  fits_adapt_images: true                  # Output a .fits file containing the adapt images used for adaptive pixelization?

fit_interferometer:                        # Settings for plots of fits to interferometer datasets (e.g. FitInterferometer).
  subplot_fit_dirty_images: false          # Plot subplot of the dirty-images of all interferometer datasets?
  subplot_fit_real_space: false            # Plot subplot of the real-space images of all interferometer datasets?
  fits_dirty_images: true                  # output dirty_images.fits showing the dirty image, noise-map, model-data, resiual-map, normalized residual map and chi-squared map?

point_dataset:                             # Settings for plots of point source datasets (e.g. PointDatasetPlotter).
  subplot_dataset: true                    # Plot the observed positions of the dataset ("Dataset Positions", numbered images, solver extent) (dataset_point.png)?
  image_with_points: true                  # Plot the observed image (if passed to AnalysisPoint) with the observed positions over it (image_with_points.png)?
  subplot_dataset_combined: true           # Multi-dataset (e.g. cluster) fits: plot every source's observed positions in one panel, labelled k·i, in the top-level image folder (dataset_point.png)?
  image_with_points_combined: true         # Multi-dataset (e.g. cluster) fits: plot the observed image with every source's positions over it, in the top-level image folder (image_with_points.png)?

fit_point_dataset:                         # Settings for plots of fits to point source datasets (e.g. FitPointDatasetPlotter).
  fit_per_image: true                      # Plot one row per source of its residual ranking (Δ/σ), image-plane zoom and source-plane panel (fit_per_image.png)?
  fit_image_with_points: true              # Plot the observed image (if passed to AnalysisPoint) with observed and model positions and critical curves over it (fit_image_with_points.png)?
  subplot_point_solver: false              # Plot how the PointSolver refines its triangles onto the best-fit model's images (point_solver.png)? Re-solves with NumPy at the best fit only, so it is off by default.
  subplot_fit_combined: true               # Multi-dataset (e.g. cluster) fits: plot every source's fit in one panel, each source's critical curves at its own redshift, in the top-level image folder (fit.png)?
  fit_per_image_combined: true             # Multi-dataset (e.g. cluster) fits: plot fit_per_image.png for every source, the ranking range shared across sources (one file per source in fit_per_image/ beyond 8 sources)?
  fit_image_with_points_combined: true     # Multi-dataset (e.g. cluster) fits: plot the observed image with every source's observed and model positions and critical curves over it (fit_image_with_points.png)?

weak_dataset:                              # Settings for plots of weak lensing shear catalogues (e.g. PlotterWeak).
  subplot_dataset: true                    # Plot subplot containing all dataset quantities (e.g. the shear field, noise-map, etc.)?

fit_weak: {}                               # Settings for plots of fits to weak lensing shear catalogues (e.g. PlotterWeak).

fit_ellipse:                               # Settings for plots of ellipse fitting fits (e.g. FitEllipse)
  data : true                              # Plot the data of the ellipse fit?
  data_no_ellipse: true                    # Plot the data without the black data ellipses, which obscure noisy data?

galaxies:                                  # Settings for plots of galaxies (e.g. Galaxies).
  subplot_galaxies: true                   # Plot subplot of all quantities in each galaxies group (e.g. images, convergence)?
  subplot_galaxy_images: false             # Plot subplot of the image of each galaxy in the model?
