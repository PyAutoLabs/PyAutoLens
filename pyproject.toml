[build-system]
requires = ["setuptools>=79.0", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autolens"
dynamic = ["version"]
description="Open-Source Strong Lensing"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "James Nightingale", email = "James.Nightingale@newcastle.ac.uk" },
    { name = "Richard Hayes", email = "richard@rghsoftware.co.uk" },
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
keywords = ["cli"]
dependencies = [
    # Prevent fallback to Nerves releases permitting the CPU LAPACK deadlock.
    "autonerves>2026.10.4.1",
    # Floor, not a pin (#687 — a floorless backtrack once installed autofit
    # 2026.4.30.582 and failed on `af.Latent`). Bump to the first release with
    # JAX in the family's base dependencies once it exists (#702), so
    # backtracking cannot pair this autolens with a jax-optional chain.
    "autogalaxy>=2026.8.22.1",
    "nautilus-sampler==1.0.5"
]

[project.urls]
Homepage = "https://github.com/PyAutoLabs/PyAutoLens"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["docs", "test_autolens", "test_autolens*"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"


[project.optional-dependencies]
# JAX moved into the base dependencies (#702). Kept as a declared no-op so
# `pip install autolens[jax]` keeps resolving (#687).
jax = []
coolest = ["coolest"]
optional = [
    "autolens[jax]",
    "coolest",
    "numba",
    "zeus-mcmc==2.5.4",
    "getdist==1.4"
]
docs=[
    "sphinx",
    "furo",
    "myst-parser",
    "sphinx_copybutton",
    "sphinx_design",
    "sphinx_inline_tabs",
    "sphinx_autodoc_typehints"
]
test = ["pytest", "coolest"]
dev = ["pytest", "black", "coolest"]

[tool.setuptools.package-data]
"autolens.config" = ["*"]

[tool.pytest.ini_options]
testpaths = ["test_autolens"]
filterwarnings = [
    "ignore:cuda_plugin_extension:UserWarning",
    "ignore::DeprecationWarning:jax",
]
